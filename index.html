<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Siege</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08111f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08111f;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      #game {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        cursor: crosshair;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
