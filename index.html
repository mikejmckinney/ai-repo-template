<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector Siege</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08111f;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08111f;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      #game {
        width: min(100vw, 1280px);
        height: min(100vh, 720px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #08111f;
        box-shadow: 0 0 0 1px rgba(73, 220, 177, 0.24), 0 24px 80px rgba(0, 0, 0, 0.4);
      }

      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: auto;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <p id="screen-reader-status" class="visually-hidden" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
