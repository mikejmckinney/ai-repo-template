<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <title>Vector Siege</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08111f;
        font-family: Arial, Helvetica, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08111f;
      }

      body {
        display: grid;
        place-items: center;
      }

      #game {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #08111f;
      }

      #game canvas {
        display: block;
        outline: none;
        touch-action: none;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Vector Siege game"></main>
    <div id="game-status" class="visually-hidden" aria-live="polite">menu score 0 wave 0</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
