# .github/actionlint.yaml — Per-repo actionlint configuration.
# See: https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# Suppress shellcheck findings that are either false positives in workflow
# run: blocks or pre-existing info/style-level issues in existing workflow
# files.  SC2038 (use -print0/-0) is NOT suppressed here — it is fixed
# in lint-and-format.yml directly.
#
# Review this list when bumping actionlint version; some rules may have
# been reclassified or the codebase may have been remediated.
paths:
  - pattern: '.github/workflows/*.yml'
    ignore:
      - 'SC2016'  # jq/sed/awk expressions in single quotes are intentional
      - 'SC2086'  # pre-existing unquoted variables in workflow run: blocks
      - 'SC2129'  # style: { cmd1; cmd2; } >> file — advisory only
      - 'SC2153'  # false positive: GitHub Actions env vars (MERGED_PR, REPO, etc.)
      - 'SC2018'  # use [:lower:] — pre-existing charset alternative suggestion
      - 'SC2019'  # use [:upper:] — pre-existing charset alternative suggestion
  - pattern: '.github/workflows/*.yaml'
    ignore:
      - 'SC2016'
      - 'SC2086'
      - 'SC2129'
      - 'SC2153'
      - 'SC2018'
      - 'SC2019'
