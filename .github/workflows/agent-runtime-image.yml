name: Agent runtime image

on:
  push:
    branches: [main]
    paths:
      - ".github/agent-runtime/**"
      - ".github/workflows/agent-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: agent-runtime-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-repo-agent-runtime" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/agent-runtime
          file: .github/agent-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:1.18.0
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload scan result
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Record digest
        run: |
          echo "Agent runtime: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "Set repository variable AGENT_RUNTIME_IMAGE to this digest-addressed reference."
