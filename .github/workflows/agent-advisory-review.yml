# Agent — advisory review snapshot (opt-in via ai-review:live)
# -----------------------------------------------------------
# Non-blocking rolling advisory review for draft/WIP PRs. Posts or updates
# one sticky issue comment (marker: <!-- ai-advisory-review:v1 -->).
# Does NOT submit formal PR reviews, mutate PR state, or push commits.
#
# Providers (ADVISORY_REVIEW_PROVIDER repo variable, default auto):
#   - claude      — Claude Code Opus 5 Medium + read-only GitHub MCP
#   - opencode    — explicit OpenCode Sol/Kimi + read-only GitHub MCP
#   - cursor      — Cursor SDK + read-only GitHub MCP
#   - auto        — Claude Opus 5 Medium, Sol 5.6 Medium, Grok 4.5 Medium, Kimi K3
#
# Scripts: scripts/workflows/advisory-review/ (AP8 — not .github/scripts/).

name: Agent — advisory review snapshot

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: advisory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory-review:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-review:live') &&
      !contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'ai-review:live' ||
        (
          github.event.label.name == 'ai-review:full' &&
          contains(github.event.pull_request.labels.*.name, 'ai-review:live')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      ADVISORY_REVIEW_PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
      ADVISORY_REVIEW_COMMENT_LIMIT: ${{ vars.ADVISORY_REVIEW_COMMENT_LIMIT || '' }}
      ADVISORY_CANDIDATE_TIMEOUT_SECONDS: ${{ vars.ADVISORY_CANDIDATE_TIMEOUT_SECONDS || '300' }}
      CURSOR_ADVISORY_MODEL: ${{ vars.CURSOR_ADVISORY_MODEL || 'cursor-grok-4.5-medium' }}
      OPENCODE_OAUTH_MIN_TTL_SECONDS: 2100
      OPENCODE_ENABLE_EXA: 1
      FULL_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review:full') }}
    steps:
      - name: Verify required secrets
        env:
          HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_OAUTH_SECRET != '' }}
          HAS_OPENCODE_AUTH: ${{ secrets.OPENCODE_OPENAI_AUTH != '' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
        run: |
          has_claude=0 has_opencode=0 has_sol=0 has_kimi=0 has_cursor=0
          claude_candidate=false
          [[ "$HAS_CLAUDE_OAUTH" == "true" ]] && has_claude=1
          if [[ -n "$OPENCODE_GITHUB_TOKEN" && "$HAS_OPENCODE_AUTH" == "true" ]]; then has_sol=1; fi
          if [[ -n "$OPENCODE_GITHUB_TOKEN" && -n "$OPENROUTER_API_KEY" ]]; then has_kimi=1; fi
          has_opencode="$has_kimi"
          [[ -n "$CURSOR_API_KEY" ]] && has_cursor=1
          [[ "$has_claude" -eq 1 && -n "$OPENCODE_GITHUB_TOKEN" ]] || has_claude=0
          [[ "$has_cursor" -eq 1 && -n "$OPENCODE_GITHUB_TOKEN" ]] || has_cursor=0
          case "$PROVIDER" in
            claude)
              [[ "$has_claude" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=claude requires CLAUDE_OAUTH_SECRET plus OPENCODE_GITHUB_TOKEN"; exit 1; }
              ;;
            opencode)
              [[ "$has_opencode" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=opencode requires OPENROUTER_API_KEY plus OPENCODE_GITHUB_TOKEN"; exit 1; }
              ;;
            cursor)
              [[ "$has_cursor" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=cursor requires CURSOR_API_KEY plus OPENCODE_GITHUB_TOKEN"; exit 1; }
              ;;
            auto)
              [[ "$has_claude" -eq 1 || "$has_sol" -eq 1 || "$has_cursor" -eq 1 || "$has_kimi" -eq 1 ]] || {
                echo "::error::Advisory review needs Claude, Sol, Grok, or Kimi credentials."
                echo "::error::Add at least one: Settings → Secrets and variables → Actions."
                exit 1
              }
              ;;
            *)
              echo "::error::Unknown ADVISORY_REVIEW_PROVIDER=$PROVIDER"
              exit 1
              ;;
          esac
          if [[ "$has_claude" -eq 1 && ( "$PROVIDER" == "auto" || "$PROVIDER" == "claude" ) ]]; then
            claude_candidate=true
          fi
          echo "CLAUDE_CANDIDATE=$claude_candidate" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/agent-runtime/package-lock.json

      - name: Install agent prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          command -v rg >/dev/null

      - name: Install agent runtime
        run: |
          npm ci --prefix .github/agent-runtime
          echo "$GITHUB_WORKSPACE/.github/agent-runtime/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCODE_SDK_MODULE=$GITHUB_WORKSPACE/.github/agent-runtime/node_modules/@opencode-ai/sdk/dist/v2/index.js" >> "$GITHUB_ENV"
          echo "CURSOR_SDK_MODULE=$GITHUB_WORKSPACE/.github/agent-runtime/node_modules/@cursor/sdk/dist/esm/index.js" >> "$GITHUB_ENV"

      - name: Install Claude Code
        if: env.CLAUDE_CANDIDATE == 'true'
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.220
          claude --version

      - name: Run advisory review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_SECRET }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_OPENAI_AUTH }}
        run: |
          chmod +x scripts/workflows/advisory-review/*.sh scripts/workflows/advisory-review/*.py 2>/dev/null || true
          bash scripts/workflows/advisory-review/run-advisory-review.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${FULL_MODE}"

      - name: Upload failed Claude session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-claude-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/advisory-claude-session/
          if-no-files-found: ignore
          retention-days: 7
