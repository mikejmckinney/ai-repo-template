# Agent — advisory review snapshot (opt-in via ai-review:live)
# -----------------------------------------------------------
# Non-blocking rolling advisory review for draft/WIP PRs. Posts or updates
# one sticky issue comment (marker: <!-- ai-advisory-review:v1 -->).
# Does NOT submit formal PR reviews, apply claude-fix, or push commits.
#
# Providers (ADVISORY_REVIEW_PROVIDER repo variable, default auto):
#   - cursor      — Cursor SDK (CURSOR_API_KEY)
#   - antigravity — Gemini Interactions / Antigravity (GEMINI_API_KEY + ADVISORY_ANTIGRAVITY_ENABLED=true)
#   - gemini      — Gemini generateContent API (GEMINI_API_KEY or GOOGLE_API_KEY)
#   - auto        — cursor, else antigravity (when enabled), else gemini
#
# Scripts: scripts/workflows/advisory-review/ (AP8 — not .github/scripts/).

name: Agent — advisory review snapshot

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: advisory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory-review:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-review:live') &&
      !contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'ai-review:live'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ADVISORY_REVIEW_PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
      ADVISORY_ANTIGRAVITY_ENABLED: ${{ vars.ADVISORY_ANTIGRAVITY_ENABLED || 'false' }}
      ADVISORY_ANTIGRAVITY_AGENT: ${{ vars.ADVISORY_ANTIGRAVITY_AGENT || 'antigravity-preview-05-2026' }}
      ADVISORY_REVIEW_DIFF_LIMIT_LIVE: ${{ vars.ADVISORY_REVIEW_DIFF_LIMIT_LIVE || '' }}
      ADVISORY_REVIEW_DIFF_LIMIT_FULL: ${{ vars.ADVISORY_REVIEW_DIFF_LIMIT_FULL || '' }}
      ADVISORY_REVIEW_COMMENT_LIMIT: ${{ vars.ADVISORY_REVIEW_COMMENT_LIMIT || '' }}
      CURSOR_ADVISORY_MODEL: ${{ vars.CURSOR_ADVISORY_MODEL || 'composer-2.5' }}
      GEMINI_ADVISORY_MODEL: ${{ vars.GEMINI_ADVISORY_MODEL || 'gemini-3.5-flash' }}
      FULL_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review:full') }}
    steps:
      - name: Verify required secrets
        env:
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
          ANTIGRAVITY_ENABLED: ${{ vars.ADVISORY_ANTIGRAVITY_ENABLED || 'false' }}
        run: |
          has_cursor=0 has_gemini=0
          [[ -n "$CURSOR_API_KEY" ]] && has_cursor=1
          [[ -n "$GEMINI_API_KEY" || -n "$GOOGLE_API_KEY" ]] && has_gemini=1
          if [[ -z "${CLAUDE_PAT:-}" ]]; then
            echo "::notice::CLAUDE_PAT unset; PR comment API will use GITHUB_TOKEN (set CLAUDE_PAT if comment POST returns 403)."
          fi
          case "$PROVIDER" in
            cursor)
              [[ "$has_cursor" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=cursor but CURSOR_API_KEY is missing"; exit 1; }
              ;;
            antigravity)
              [[ "$has_gemini" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=antigravity but GEMINI_API_KEY/GOOGLE_API_KEY is missing"; exit 1; }
              [[ "$ANTIGRAVITY_ENABLED" == "true" ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=antigravity but ADVISORY_ANTIGRAVITY_ENABLED is not true"; exit 1; }
              ;;
            gemini)
              [[ "$has_gemini" -eq 1 ]] || { echo "::error::ADVISORY_REVIEW_PROVIDER=gemini but GEMINI_API_KEY/GOOGLE_API_KEY is missing"; exit 1; }
              ;;
            auto)
              [[ "$has_cursor" -eq 1 || "$has_gemini" -eq 1 ]] || {
                echo "::error::Advisory review needs CURSOR_API_KEY and/or GEMINI_API_KEY (or GOOGLE_API_KEY)."
                echo "::error::Add at least one: Settings → Secrets and variables → Actions."
                exit 1
              }
              ;;
            *)
              echo "::error::Unknown ADVISORY_REVIEW_PROVIDER=$PROVIDER"
              exit 1
              ;;
          esac

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js (Cursor SDK path)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run advisory review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Prefer CLAUDE_PAT for issue-comment POST/PATCH — matches agent-review-on-push
          # and avoids org policies that restrict GITHUB_TOKEN write on pull_request.
          if [[ -n "${CLAUDE_PAT:-}" ]]; then
            export GH_TOKEN="$CLAUDE_PAT"
            echo "Using CLAUDE_PAT for gh PR comment API."
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            echo "Using GITHUB_TOKEN for gh PR comment API (CLAUDE_PAT unset)."
          fi
          chmod +x scripts/workflows/advisory-review/*.sh scripts/workflows/advisory-review/*.py 2>/dev/null || true
          bash scripts/workflows/advisory-review/run-advisory-review.sh \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${FULL_MODE}"
