name: Refresh external skills

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Optional owner/repository source to refresh"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  discover-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false

      - name: Select locked sources
        id: sources
        env:
          REQUESTED_SOURCE: ${{ inputs.source || '' }}
        run: |
          sources="$(jq -ce --arg requested "$REQUESTED_SOURCE" '
            ([.skills[].source] | unique) as $sources
            | if $requested == "" then $sources
              elif ($sources | index($requested)) != null then [$requested]
              else error("requested source is not declared in skills-lock.json")
              end
          ' skills-lock.json)"
          echo "sources=$sources" >>"$GITHUB_OUTPUT"

  refresh-source:
    needs: discover-sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.discover-sources.outputs.sources) }}
    concurrency:
      group: skill-refresh-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check source head
        id: check
        env:
          SOURCE: ${{ matrix.source }}
          RESULT_PATH: ${{ runner.temp }}/skill-refresh-check.json
        run: |
          python3 scripts/skill-supply-chain.py check \
            --repo "$PWD" \
            --lock skills-lock.json \
            --source "$SOURCE" | tee "$RESULT_PATH"
          echo "content_changed=$(jq -r '.changed' "$RESULT_PATH")" >>"$GITHUB_OUTPUT"
          echo "target_ref=$(jq -r '.newRef' "$RESULT_PATH")" >>"$GITHUB_OUTPUT"

      - name: Install test dependencies
        if: steps.check.outputs.content_changed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats parallel ripgrep

      - name: Update source packages
        if: steps.check.outputs.content_changed == 'true'
        env:
          SOURCE: ${{ matrix.source }}
          TARGET_REF: ${{ steps.check.outputs.target_ref }}
          RESULT_PATH: ${{ runner.temp }}/skill-refresh-update.json
        run: |
          python3 scripts/skill-supply-chain.py update \
            --repo "$PWD" \
            --lock skills-lock.json \
            --source "$SOURCE" \
            --ref "$TARGET_REF" | tee "$RESULT_PATH"

      - name: Scan refreshed packages for secrets
        if: steps.check.outputs.content_changed == 'true'
        env:
          RESULT_PATH: ${{ runner.temp }}/skill-refresh-update.json
        run: |
          mapfile -t package_paths < <(
            jq -r --slurpfile result "$RESULT_PATH" '
              . as $lock
              | $result[0].packages[]
              | select($lock.skills[.] != null)
              | $lock.skills[.].destinationPath
            ' skills-lock.json
          )
          if ((${#package_paths[@]})); then
            python3 scripts/scan-skill-secrets.py "${package_paths[@]}"
          fi

      - name: Run repository validation
        if: steps.check.outputs.content_changed == 'true'
        env:
          VALIDATION_PATH: ${{ runner.temp }}/skill-refresh-validation.log
        run: |
          set -o pipefail
          {
            python3 scripts/skill-supply-chain.py validate-lock \
              --repo "$PWD" \
              --lock skills-lock.json
            bats scripts/tests/skill-supply-chain.bats scripts/tests/skill-refresh-workflow.bats
            ./test.sh
          } | tee "$VALIDATION_PATH"

      - name: Render pull request body
        if: steps.check.outputs.content_changed == 'true'
        env:
          SOURCE: ${{ matrix.source }}
          RESULT_PATH: ${{ runner.temp }}/skill-refresh-update.json
          BODY_PATH: ${{ runner.temp }}/skill-refresh-pr.md
        run: |
          old_ref="$(jq -r '.oldRef' "$RESULT_PATH")"
          new_ref="$(jq -r '.newRef' "$RESULT_PATH")"
          {
            printf '## External skill refresh\n\n'
            printf -- '- Source: [%s](https://github.com/%s)\n' "$SOURCE" "$SOURCE"
            # shellcheck disable=SC2016
            printf -- '- Previous ref: [`%s`](https://github.com/%s/commit/%s)\n' "$old_ref" "$SOURCE" "$old_ref"
            # shellcheck disable=SC2016
            printf -- '- Proposed ref: [`%s`](https://github.com/%s/commit/%s)\n\n' "$new_ref" "$SOURCE" "$new_ref"
            printf '### Content-changed packages\n\n'
            jq -r '.packages[] | "- `\(.)`"' "$RESULT_PATH"
            printf '\n### Ref-only lock records\n\n'
            jq -r 'if (.refOnlyPackages | length) == 0 then "- None" else .refOnlyPackages[] | "- `\(.)`" end' "$RESULT_PATH"
            printf '\n### Automatic deletions\n\n'
            printf -- '- None. Missing upstream paths block refresh and require explicit review.\n'
            printf '\n### Deterministic hashes\n\n```json\n'
            jq '.hashes' "$RESULT_PATH"
            printf '```\n\n### Validation\n\n'
            printf -- '- Deterministic lock validation passed.\n'
            printf -- '- Refreshed-package secret scan passed.\n'
            printf -- '- Pinned license evidence resolved at the proposed ref.\n'
            printf -- '- Supply-chain Bats tests and repository checks passed.\n\n'
            printf '> Third-party review required: inspect the upstream diff and all vendored changes before merge. This workflow never auto-merges.\n'
          } >"$BODY_PATH"

      - name: Create or update review pull request
        id: create-pr
        if: steps.check.outputs.content_changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/skill-refresh/${{ matrix.source }}
          delete-branch: false
          add-paths: |
            .agents/skills
            docs/guides/skill-supply-chain.md
            skills-lock.json
          commit-message: "chore: refresh ${{ matrix.source }} skills"
          title: "chore: refresh ${{ matrix.source }} skills"
          body-path: ${{ runner.temp }}/skill-refresh-pr.md
          labels: |
            automated
            dependencies
          draft: always-true

      - name: Dispatch required checks for the generated head
        if: >-
          steps.check.outputs.content_changed == 'true' &&
          steps.create-pr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: automation/skill-refresh/${{ matrix.source }}
          REFRESH_HEAD: ${{ steps.create-pr.outputs.pull-request-head-sha }}
        run: |
          gh workflow run ci-tests.yml \
            --ref "$REFRESH_BRANCH" \
            -f head_sha="$REFRESH_HEAD"
          gh workflow run lint-and-format.yml \
            --ref "$REFRESH_BRANCH" \
            -f base_sha="${{ github.sha }}" \
            -f head_sha="$REFRESH_HEAD"
