# Agent — Re-trigger Gemini & Copilot review on push (#205)
# ---------------------------------------------------------
# Two of the three external AI review bots installed on this repo
# (gemini-code-assist[bot], copilot-pull-request-reviewer[bot]) only
# review on PR open / ready_for_review by default and ignore subsequent
# pushes. Codex already re-reviews on push.
#
# This workflow nudges both bots after every push to an open non-draft
# same-repo PR:
#   - Gemini: post a `/gemini review` issue comment (the documented
#     manual re-review slash command).
#   - Copilot: re-request review via the requested_reviewers REST API.
#     A naive POST is idempotent — re-POSTing an already-requested
#     reviewer is a no-op and does NOT fire a fresh review_requested
#     event, so Copilot doesn't see a fresh request. We DELETE first
#     to clear state, then POST to create a real event.
#
# Default OFF. Opt in by setting repo variable REVIEW_ON_PUSH=true
# (Settings → Secrets and variables → Actions → Variables tab). With
# the variable unset/empty/false the runner does not spin up.
#
# A repository ruleset ("Settings → Rules → Rulesets → Automatically
# request Copilot code review") is a server-side alternative for the
# Copilot half. It was tried on this repo (April 2026) and did not
# fire on push, so the workflow handles both bots. The ruleset can
# stay enabled — if GitHub fixes it later, the only effect is Copilot
# may review twice (cosmetic, not a failure mode). See
# docs/guides/agent-pipeline.md → "Alternative: Copilot ruleset".

name: Agent — Re-trigger reviews on push

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  # `issues: write` required for the Gemini nudge: GitHub treats PR
  # discussion comments as issue comments, and with an explicit
  # `permissions:` block nothing is granted implicitly. Without this
  # the POST to `/repos/{owner}/{repo}/issues/{pr}/comments` 403s
  # and Gemini never gets nudged. Reported by copilot-pull-request-reviewer
  # on PR #217.
  issues: write

# One nudge per PR at a time. Rapid consecutive pushes collapse to the
# latest one — no separate sleep/debounce needed.
concurrency:
  group: review-on-push-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nudge:
    # All gates collapsed at job level so the runner does not spin up
    # when off. Mirrors the actor-skip + fork-skip + smoke-test-skip
    # patterns in agent-fix-reviews.yml and agent-relay-reviews.yml.
    if: >-
      vars.REVIEW_ON_PUSH == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]' &&
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      # Per-step `continue-on-error: true` so a transient failure on one
      # half (Copilot API surface change, Gemini quota, etc.) does not
      # block the other from running. Outcomes are captured via step ids
      # and a final `if: always()` step fails the job iff BOTH nudges
      # failed — so silent regressions surface, but a single-bot outage
      # does not block the other bot's nudge. Reported by
      # chatgpt-codex-connector and copilot-pull-request-reviewer on
      # PR #217.

      - name: Nudge Gemini (/gemini review)
        id: gemini
        continue-on-error: true
        run: |
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
            -f body='/gemini review'

      - name: Re-request Copilot review (DELETE then POST)
        id: copilot
        continue-on-error: true
        run: |
          # DELETE may 422 if the reviewer was not previously requested.
          # That is an expected transient state (e.g. first push after a
          # human un-requested Copilot), not a failure mode — swallow it
          # with `|| true` so we always proceed to the POST.
          gh api -X DELETE "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer' || true
          # POST is the call that actually fires the review_requested
          # event. Real errors here (auth, rate limit, endpoint change)
          # MUST surface — no `|| true`. The step's `continue-on-error`
          # still lets the Gemini half count toward the job's success,
          # but the captured outcome feeds the always() check below.
          gh api -X POST "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer'

      - name: Fail job if both nudges failed
        if: always() && steps.gemini.outcome == 'failure' && steps.copilot.outcome == 'failure'
        run: |
          echo "::error::Both Gemini and Copilot nudges failed. Check token permissions, API surface changes, and recent runs of this workflow."
          exit 1
