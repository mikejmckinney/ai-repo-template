# Agent — Re-trigger Gemini & Copilot review on push (#205)
# ---------------------------------------------------------
# Two of the three external AI review bots installed on this repo
# (gemini-code-assist[bot], copilot-pull-request-reviewer[bot]) only
# review on PR open / ready_for_review by default and ignore subsequent
# pushes. Codex already re-reviews on push.
#
# This workflow nudges both bots after every push to an open non-draft
# same-repo PR:
#   - Gemini: post a `/gemini review` issue comment (the documented
#     manual re-review slash command).
#   - Copilot: re-request review via the GraphQL
#     `requestReviewsByLogin` mutation with `botLogins:
#     ["copilot-pull-request-reviewer[bot]"]` (note the [bot] suffix).
#     The REST endpoint `requested_reviewers` rejects the bare bot
#     login with HTTP 422 "Reviews may only be requested from
#     collaborators"; the sibling `requestReviews` mutation rejects
#     Bot node IDs in its `userIds` field ("Could not resolve to
#     User node"). Only `requestReviewsByLogin` exposes a dedicated
#     `botLogins` argument that accepts the suffixed bot login.
#     Mechanism confirmed by reading cli/cli source
#     (api/queries_pr_review.go::RequestReviewsByLogin) after three
#     other approaches silently no-op'd or failed on PR #217.
#
# Default OFF. Opt in by setting repo variable REVIEW_ON_PUSH=true
# (Settings → Secrets and variables → Actions → Variables tab). With
# the variable unset/empty/false the runner does not spin up.
#
# Auth: the Gemini step uses CLAUDE_PAT (a user-scoped fine-grained PAT,
# already required by other workflows in this repo) instead of
# GITHUB_TOKEN. Reason: Gemini Code Assist filters slash commands posted
# by `github-actions[bot]` to prevent reviewer loops, so a comment posted
# under GITHUB_TOKEN is silently ignored. Posting under a real user PAT
# bypasses the filter. The Copilot step keeps GITHUB_TOKEN — the
# requested_reviewers REST call doesn't care who initiates it.
#
# A repository ruleset ("Settings → Rules → Rulesets → Automatically
# request Copilot code review") is a server-side alternative for the
# Copilot half. It was tried on this repo (April 2026) and did not
# fire on push, so the workflow handles both bots. The ruleset can
# stay enabled — if GitHub fixes it later, the only effect is Copilot
# may review twice (cosmetic, not a failure mode). See
# docs/guides/agent-pipeline.md → "Alternative: Copilot ruleset".

name: Agent — Re-trigger reviews on push

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  # `issues: write` required for the Gemini nudge: GitHub treats PR
  # discussion comments as issue comments, and with an explicit
  # `permissions:` block nothing is granted implicitly. Without this
  # the POST to `/repos/{owner}/{repo}/issues/{pr}/comments` 403s
  # and Gemini never gets nudged. Reported by copilot-pull-request-reviewer
  # on PR #217.
  issues: write

# One nudge per PR at a time. Rapid consecutive pushes collapse to the
# latest one — no separate sleep/debounce needed.
concurrency:
  group: review-on-push-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nudge:
    # All gates collapsed at job level so the runner does not spin up
    # when off. Mirrors the actor-skip + fork-skip + smoke-test-skip
    # patterns in agent-fix-reviews.yml and agent-relay-reviews.yml.
    if: >-
      vars.REVIEW_ON_PUSH == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
      github.actor != 'Copilot' &&
      github.actor != 'copilot-swe-agent[bot]' &&
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Verify required secrets
        env:
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
        run: |
          if [[ -z "$CLAUDE_PAT" ]]; then
            echo "::error::Missing required secret: CLAUDE_PAT"
            echo "::error::Required so the /gemini review comment posts under a real user identity (Gemini ignores slash commands from github-actions[bot])."
            echo "::error::See docs/guides/agent-pipeline.md → Required secrets for required PAT scopes."
            exit 1
          fi

      # Per-step `continue-on-error: true` so a transient failure on one
      # half (Copilot API surface change, Gemini quota, etc.) does not
      # block the other from running. Outcomes are captured via step ids
      # and a final `if: always()` step fails the job iff BOTH nudges
      # failed — so silent regressions surface, but a single-bot outage
      # does not block the other bot's nudge. Reported by
      # chatgpt-codex-connector and copilot-pull-request-reviewer on
      # PR #217.

      - name: Nudge Gemini (/gemini review)
        id: gemini
        continue-on-error: true
        env:
          # Override job-level GH_TOKEN with CLAUDE_PAT for this step only.
          # Gemini Code Assist ignores slash commands from github-actions[bot]
          # (loop-prevention filter), so the comment must be posted under a
          # real user identity to actually trigger a re-review.
          GH_TOKEN: ${{ secrets.CLAUDE_PAT }}
        run: |
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" \
            -f body='/gemini review'

      - name: Re-request Copilot review (GraphQL requestReviewsByLogin)
        id: copilot
        continue-on-error: true
        run: |
          # Why this specific mutation: three other paths all fail.
          #   1. REST `POST /repos/{o}/{r}/pulls/{n}/requested_reviewers`
          #      with `reviewers[]=copilot-pull-request-reviewer` returns
          #      HTTP 422 "Reviews may only be requested from collaborators"
          #      — REST only accepts collaborator user logins.
          #   2. The same REST endpoint with friendly aliases ("Copilot",
          #      "copilot", "copilot[bot]", "github-copilot") returns
          #      HTTP 200 OK but silently leaves `requested_reviewers: []`
          #      — silent no-op, no error surfaced.
          #   3. GraphQL `requestReviews` with a Bot's global node ID in
          #      `userIds: [ID!]` fails with "Could not resolve to User
          #      node" — the schema requires User type, not Bot, even
          #      though Bot IDs exist.
          # Only `requestReviewsByLogin` exposes a dedicated `botLogins:
          # [String!]` field. The bot login MUST carry the `[bot]` suffix
          # (`copilot-pull-request-reviewer[bot]`) — cli/cli appends it
          # automatically; we have to do it explicitly.
          # Mechanism reverse-engineered from cli/cli source
          # (api/queries_pr_review.go::RequestReviewsByLogin) and
          # smoke-tested on PR #217. NB: this mutation is github.com only,
          # not GHES (per cli/cli source comment).
          PR_NODE_ID=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$num:Int!){repository(owner:$owner,name:$name){pullRequest(number:$num){id}}}' \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F num="${PR}" \
            --jq '.data.repository.pullRequest.id')

          # `union: true` adds Copilot to the existing reviewer set
          # without clobbering human reviewers already requested.
          # GitHub fires a fresh review_requested event on each call
          # even if Copilot was already in the set — no DELETE+POST
          # dance needed.
          gh api graphql \
            -f query='mutation($pr:ID!,$bots:[String!]!){requestReviewsByLogin(input:{pullRequestId:$pr,botLogins:$bots,union:true}){clientMutationId}}' \
            -F pr="${PR_NODE_ID}" \
            -f bots='copilot-pull-request-reviewer[bot]'

      - name: Fail job if both nudges failed
        if: always() && steps.gemini.outcome == 'failure' && steps.copilot.outcome == 'failure'
        run: |
          echo "::error::Both Gemini and Copilot nudges failed. Check token permissions, API surface changes, and recent runs of this workflow."
          exit 1
