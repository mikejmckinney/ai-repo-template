# Agent — final feedback consolidation (opt-in via implementation-complete)
# -------------------------------------------------------------------------
# Non-blocking batch consolidation after implementation is finished. Posts or
# updates one sticky Feedback Inbox comment (marker: <!-- ai-feedback-inbox:v1 -->).
# Does NOT submit formal PR reviews, apply claude-fix, resolve threads, or push.
#
# Scripts: scripts/workflows/pr-feedback/ (AP8). Reuses advisory-review LLM
# runners and upsert-pr-comment.sh for provider dispatch and sticky comments.
#
# Providers (FINALIZE_REVIEW_PROVIDER or ADVISORY_REVIEW_PROVIDER, default auto):
#   - cursor — Cursor SDK (CURSOR_API_KEY)
#   - gemini — Gemini generateContent (GEMINI_API_KEY or GOOGLE_API_KEY)
#   - auto   — cursor if key present, else gemini
#   antigravity (advisory-only) falls back to auto when unset on FINALIZE_REVIEW_PROVIDER

name: Agent — final feedback consolidation

on:
  pull_request:
    types: [labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-finalize-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  finalize-feedback:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'implementation-complete') &&
        !contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
        (
          (github.event.action == 'labeled' &&
           github.event.label.name == 'implementation-complete') ||
          github.event.action == 'ready_for_review'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      FINALIZE_REVIEW_PROVIDER: ${{ vars.FINALIZE_REVIEW_PROVIDER || '' }}
      ADVISORY_REVIEW_PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
      FINALIZE_REVIEW_DIFF_LIMIT: ${{ vars.FINALIZE_REVIEW_DIFF_LIMIT || '' }}
      FINALIZE_REVIEW_COMMENT_LIMIT: ${{ vars.FINALIZE_REVIEW_COMMENT_LIMIT || '' }}
      CURSOR_FINALIZE_MODEL: ${{ vars.CURSOR_FINALIZE_MODEL || '' }}
      GEMINI_FINALIZE_MODEL: ${{ vars.GEMINI_FINALIZE_MODEL || '' }}
      CURSOR_ADVISORY_MODEL: ${{ vars.CURSOR_ADVISORY_MODEL || 'composer-2.5' }}
      GEMINI_ADVISORY_MODEL: ${{ vars.GEMINI_ADVISORY_MODEL || 'gemini-3.5-flash' }}
    steps:
      - name: Verify required secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROVIDER: ${{ vars.FINALIZE_REVIEW_PROVIDER || vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
        run: |
          has_cursor=0 has_gemini=0
          [[ -n "$CURSOR_API_KEY" ]] && has_cursor=1
          [[ -n "$GEMINI_API_KEY" || -n "$GOOGLE_API_KEY" ]] && has_gemini=1
          if [[ "$PROVIDER" == "antigravity" ]]; then
            echo "::notice::ADVISORY_REVIEW_PROVIDER=antigravity is advisory-only; finalize uses auto (cursor, else gemini)."
            PROVIDER=auto
          fi
          case "$PROVIDER" in
            cursor)
              [[ "$has_cursor" -eq 1 ]] || { echo "::error::FINALIZE_REVIEW_PROVIDER=cursor but CURSOR_API_KEY is missing"; exit 1; }
              ;;
            gemini)
              [[ "$has_gemini" -eq 1 ]] || { echo "::error::FINALIZE_REVIEW_PROVIDER=gemini but GEMINI_API_KEY/GOOGLE_API_KEY is missing"; exit 1; }
              ;;
            auto)
              [[ "$has_cursor" -eq 1 || "$has_gemini" -eq 1 ]] || {
                echo "::error::Final feedback consolidation needs CURSOR_API_KEY and/or GEMINI_API_KEY (or GOOGLE_API_KEY)."
                exit 1
              }
              ;;
            *)
              echo "::error::Unknown FINALIZE_REVIEW_PROVIDER=$PROVIDER"
              exit 1
              ;;
          esac

      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          pr_json="$(gh pr view "$PR" --json state,headRefOid,headRepository)"
          state="$(printf '%s' "$pr_json" | jq -r .state)"
          head_sha="$(printf '%s' "$pr_json" | jq -r .headRefOid)"
          head_repo="$(printf '%s' "$pr_json" | jq -r .headRepository.nameWithOwner)"
          if [[ "$state" != "OPEN" ]]; then
            echo "::error::PR #${PR} is not open (state=${state})"
            exit 1
          fi
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "::error::PR #${PR} head repo ${head_repo} is not same-repo (${REPO}); fork PRs are not supported"
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js (Cursor SDK path)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run feedback consolidation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          if [[ -n "${CLAUDE_PAT:-}" ]]; then
            export GH_TOKEN="$CLAUDE_PAT"
            echo "Using CLAUDE_PAT for gh PR comment API."
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            echo "Using GITHUB_TOKEN for gh PR comment API (CLAUDE_PAT unset)."
          fi
          chmod +x scripts/workflows/pr-feedback/*.sh 2>/dev/null || true
          chmod +x scripts/workflows/advisory-review/*.sh 2>/dev/null || true
          bash scripts/workflows/pr-feedback/run-feedback-consolidation.sh \
            "${{ github.event.pull_request.number || inputs.pr }}" \
            "${{ steps.pr.outputs.head_sha }}"
