name: Finalize external skill refresh

on:
  workflow_run:
    workflows: ["CI Tests", "Lint and Format"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: skill-refresh-finalize-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'automation/skill-refresh/all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted finalizer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false

      - name: Finalize exact-head aggregate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_BRANCH: automation/skill-refresh/all
          REFRESH_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/workflows/lib/finalize-skill-refresh.sh "$REFRESH_BRANCH" "$REFRESH_HEAD"
