# Sandbox smoke — post-merge retro v2 (ADR-016 / ADR-029)
# -------------------------------------------------------------------
# workflow_dispatch: push current ref to sandbox main, ensure sandbox repo
# exists, trigger agent-postmerge-retro.yml on the sandbox, poll for result.
#
# Requires repo secrets: SANDBOX_BOOTSTRAP_TOKEN (classic PAT: repo + workflow).
# Optional: SANDBOX_PAT (fine-grained PAT for sandbox CLAUDE_PAT secret).
# Sandbox must also have CURSOR_API_KEY and/or GEMINI_API_KEY for retro LLM steps.

name: Sandbox smoke — post-merge retro

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to push to sandbox main (branch or SHA)"
        required: true
        default: feature/postmerge-retro-daily-v2

permissions:
  contents: read

jobs:
  sandbox-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_REPO: ${{ github.repository }}
      SANDBOX_REPO: mikejmckinney/ai-repo-template-sandbox
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Ensure sandbox repo and push main
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.SANDBOX_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::error::SANDBOX_BOOTSTRAP_TOKEN secret is required"
            exit 1
          fi
          export GH_TOKEN="$BOOTSTRAP_TOKEN"
          if ! gh repo view "$SANDBOX_REPO" >/dev/null 2>&1; then
            echo "Creating sandbox repo $SANDBOX_REPO..."
            gh repo create "$SANDBOX_REPO" --private \
              --description "Sandbox for verifying default-branch-only workflows from ${UPSTREAM_REPO} (ADR-016)"
          fi
          git remote remove sandbox-push 2>/dev/null || true
          git remote add sandbox-push "https://x-access-token:${BOOTSTRAP_TOKEN}@github.com/${SANDBOX_REPO}.git"
          git push --force sandbox-push HEAD:main
          echo "Pushed ${GITHUB_SHA} to sandbox main"

      - name: Mirror sandbox secrets
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.SANDBOX_BOOTSTRAP_TOKEN }}
          SANDBOX_PAT: ${{ secrets.SANDBOX_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$BOOTSTRAP_TOKEN"
          mirror_secret() {
            local name="$1" val="$2"
            if [[ -n "${val:-}" ]]; then
              printf '%s' "$val" | gh secret set "$name" --repo "$SANDBOX_REPO"
              echo "Mirrored ${name} to sandbox"
            fi
          }
          mirror_secret CLAUDE_PAT "${SANDBOX_PAT:-}"
          mirror_secret CURSOR_API_KEY "${CURSOR_API_KEY:-}"
          mirror_secret GEMINI_API_KEY "${GEMINI_API_KEY:-}"
          mirror_secret GOOGLE_API_KEY "${GOOGLE_API_KEY:-}"

      - name: Trigger post-merge retro on sandbox
        id: trigger
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.SANDBOX_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$BOOTSTRAP_TOKEN"
          gh workflow run agent-postmerge-retro.yml -R "$SANDBOX_REPO"
          echo "Waiting for workflow run to appear..."
          sleep 15
          run_id="$(gh run list -R "$SANDBOX_REPO" --workflow agent-postmerge-retro.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          run_url="$(gh run view "$run_id" -R "$SANDBOX_REPO" --json url --jq .url)"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "Sandbox retro run: ${run_url}"

      - name: Poll sandbox run (10 min max)
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.SANDBOX_BOOTSTRAP_TOKEN }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$BOOTSTRAP_TOKEN"
          deadline=$((SECONDS + 600))
          while [[ $SECONDS -lt $deadline ]]; do
            status="$(gh run view "$RUN_ID" -R "$SANDBOX_REPO" --json status,conclusion --jq '[.status,.conclusion]|@tsv')"
            echo "status=${status}"
            st="${status%%$'\t'*}"
            con="${status#*$'\t'}"
            if [[ "$st" == "completed" ]]; then
              if [[ "$con" == "success" ]]; then
                echo "::notice::Sandbox post-merge retro succeeded"
                exit 0
              fi
              echo "::error::Sandbox post-merge retro finished with conclusion=${con}"
              gh run view "$RUN_ID" -R "$SANDBOX_REPO" --log-failed || true
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for sandbox run"
          exit 1
