# Auto-Resolve Conversations on Merge
# -----------------------------------
# When a PR is merged, iterate unresolved review threads and resolve them via
# the GraphQL API.
#
# Known limitation: the GraphQL query fetches `reviewThreads(first: 100)` with
# NO pagination. A PR with more than 100 unresolved review threads will have
# its older threads left un-resolved. This is rare in practice (most PRs have
# <20 threads); if your team routinely exceeds 100, add a paginated query
# using `pageInfo { hasNextPage endCursor }`.
name: Auto-Resolve Conversations on Merge

on:
  pull_request:
    types: [closed]

jobs:
  resolve-on-merge:
    # Only run if the PR was actually merged (not just closed without merging)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Resolve all threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR #$PR_NUMBER was merged. Resolving outstanding conversations..."

          # 1. Fetch all unresolved thread IDs
          THREAD_IDS=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes { id isResolved }
                  }
                }
              }
            }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr=$PR_NUMBER \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | .id')

          # 2. Resolve them
          if [ -z "$THREAD_IDS" ]; then
            echo "No unresolved conversations found."
          else
            echo "$THREAD_IDS" | while read -r thread_id; do
              echo "Resolving thread $thread_id..."
              gh api graphql -f query='
                mutation($threadId: ID!) {
                  resolveReviewThread(input: {threadId: $threadId}) {
                    thread { isResolved }
                  }
                }' -F threadId="$thread_id" > /dev/null
            done
            echo "✅ All conversations resolved."
          fi
