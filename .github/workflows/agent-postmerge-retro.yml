# Agent — post-merge retrospective (daily batch v2)
# -------------------------------------------------------------------
# Nightly (06:00 UTC) + workflow_dispatch: scan merges to main in last 24h,
# run per-PR retro, create/append one umbrella issue, then open a draft fix PR.
#
# Checks out main for scripts. Option C: no pull_request closed trigger.

name: Agent — post-merge retrospective

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      context_profile:
        description: "Optional POSTMERGE_RETRO_CONTEXT_PROFILE override (standard, pr-review, full)"
        required: false
        type: string
      only_prs:
        description: "Optional comma-separated PR numbers (POSTMERGE_RETRO_ONLY_PRS) for smoke/A-B runs"
        required: false
        type: string
      run_date:
        description: "Optional RUN_DATE override (umbrella dedupe key; default UTC today)"
        required: false
        type: string
      fix_only:
        description: "Skip daily-retro; run fix job only (requires run_date)"
        required: false
        type: boolean
        default: false
      restore_json_from_issue:
        description: "Fix-only: restore daily-retro.json from umbrella issue snapshot comment"
        required: false
        type: boolean
        default: true
      artifact_run_id:
        description: "Fix-only: optional workflow run ID to download artifact from"
        required: false
        type: string
      artifact_run_attempt:
        description: "Fix-only: attempt number when using artifact_run_id"
        required: false
        type: string
        default: "1"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: postmerge-retro-daily
  cancel-in-progress: false

jobs:
  daily-retro:
    if: github.event.inputs.fix_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_date: ${{ steps.meta.outputs.run_date }}
      findings_count: ${{ steps.meta.outputs.findings_count }}
      has_daily_json: ${{ steps.meta.outputs.has_daily_json }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      POSTMERGE_RETRO_PROVIDER: ${{ vars.POSTMERGE_RETRO_PROVIDER || '' }}
      ADVISORY_REVIEW_PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
      POSTMERGE_RETRO_DIFF_LIMIT: ${{ vars.POSTMERGE_RETRO_DIFF_LIMIT || '' }}
      POSTMERGE_RETRO_CONTEXT_PROFILE: ${{ github.event.inputs.context_profile || vars.POSTMERGE_RETRO_CONTEXT_PROFILE || '' }}
      POSTMERGE_RETRO_ONLY_PRS: ${{ github.event.inputs.only_prs || vars.POSTMERGE_RETRO_ONLY_PRS || '' }}
      RUN_DATE: ${{ github.event.inputs.run_date || '' }}
      CURSOR_ADVISORY_MODEL: ${{ vars.CURSOR_ADVISORY_MODEL || 'composer-2.5' }}
      GEMINI_ADVISORY_MODEL: ${{ vars.GEMINI_ADVISORY_MODEL || 'gemini-3.5-flash' }}
      POSTMERGE_RETRO_MODEL: ${{ vars.POSTMERGE_RETRO_MODEL || '' }}
    steps:
      - name: Verify required secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PROVIDER: ${{ vars.POSTMERGE_RETRO_PROVIDER || vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
        run: |
          has_cursor=0 has_gemini=0
          [[ -n "$CURSOR_API_KEY" ]] && has_cursor=1
          [[ -n "$GEMINI_API_KEY" || -n "$GOOGLE_API_KEY" ]] && has_gemini=1
          if [[ "$PROVIDER" == "antigravity" ]]; then
            echo "::notice::ADVISORY_REVIEW_PROVIDER=antigravity is advisory-only; post-merge retro uses auto (cursor, else gemini)."
            PROVIDER=auto
          fi
          case "$PROVIDER" in
            cursor)
              [[ "$has_cursor" -eq 1 ]] || { echo "::error::POSTMERGE_RETRO_PROVIDER=cursor but CURSOR_API_KEY is missing"; exit 1; }
              ;;
            gemini)
              [[ "$has_gemini" -eq 1 ]] || { echo "::error::POSTMERGE_RETRO_PROVIDER=gemini but GEMINI_API_KEY/GOOGLE_API_KEY is missing"; exit 1; }
              ;;
            auto)
              [[ "$has_cursor" -eq 1 || "$has_gemini" -eq 1 ]] || {
                echo "::error::Post-merge retro needs CURSOR_API_KEY and/or GEMINI_API_KEY (or GOOGLE_API_KEY)."
                exit 1
              }
              ;;
            *)
              echo "::error::Unknown POSTMERGE_RETRO_PROVIDER=$PROVIDER"
              exit 1
              ;;
          esac

      - name: Checkout main (current workflow scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js (Cursor SDK path)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run daily retrospective
        id: retro
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [[ -n "${CLAUDE_PAT:-}" ]]; then
            export GH_TOKEN="$CLAUDE_PAT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          export RUN_DATE="${RUN_DATE:-$(date -u +%Y-%m-%d)}"
          chmod +x scripts/workflows/postmerge-retro/*.sh 2>/dev/null || true
          chmod +x scripts/workflows/advisory-review/*.sh 2>/dev/null || true
          bash scripts/workflows/postmerge-retro/run-postmerge-retro-daily.sh

      - name: Capture daily retro outputs
        id: meta
        run: |
          RUN_DATE="${RUN_DATE:-$(date -u +%Y-%m-%d)}"
          ARTIFACT_DIR=".artifacts/postmerge-retro/daily-${RUN_DATE}"
          ARTIFACT_NAME="postmerge-retro-daily-${RUN_DATE}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          if [[ -f "${ARTIFACT_DIR}/findings-count.txt" ]]; then
            count="$(cat "${ARTIFACT_DIR}/findings-count.txt")"
          else
            count=0
          fi
          echo "findings_count=${count}" >> "$GITHUB_OUTPUT"
          if [[ -f "${ARTIFACT_DIR}/daily-retro.json" ]]; then
            echo "has_daily_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_daily_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload daily retro artifacts
        if: steps.meta.outputs.has_daily_json == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: .artifacts/postmerge-retro/
          if-no-files-found: ignore
          retention-days: 14

  daily-fix:
    needs: daily-retro
    if: >-
      always() && (
        (github.event.inputs.fix_only == true && github.event.inputs.run_date != '') ||
        (
          needs.daily-retro.result == 'success' &&
          needs.daily-retro.outputs.findings_count != '0' &&
          needs.daily-retro.outputs.has_daily_json == 'true'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      POSTMERGE_RETRO_PROVIDER: ${{ vars.POSTMERGE_RETRO_PROVIDER || '' }}
      ADVISORY_REVIEW_PROVIDER: ${{ vars.ADVISORY_REVIEW_PROVIDER || 'auto' }}
      POSTMERGE_RETRO_MODEL: ${{ vars.POSTMERGE_RETRO_MODEL || '' }}
      CURSOR_ADVISORY_MODEL: ${{ vars.CURSOR_ADVISORY_MODEL || 'composer-2.5' }}
      GEMINI_ADVISORY_MODEL: ${{ vars.GEMINI_ADVISORY_MODEL || 'gemini-3.5-flash' }}
      RUN_DATE: ${{ github.event.inputs.run_date || needs.daily-retro.outputs.run_date }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download daily retro artifacts
        if: github.event.inputs.fix_only != true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.daily-retro.outputs.artifact_name }}
          path: .artifacts/postmerge-retro/

      - name: Restore daily retro JSON (fix-only)
        if: github.event.inputs.fix_only == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
        run: |
          if [[ -n "${CLAUDE_PAT:-}" ]]; then
            export GH_TOKEN="$CLAUDE_PAT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          RUN_DATE="${RUN_DATE:-${{ github.event.inputs.run_date }}}"
          ARTIFACT_DIR=".artifacts/postmerge-retro/daily-${RUN_DATE}"
          mkdir -p "$ARTIFACT_DIR"
          DAILY_JSON="${ARTIFACT_DIR}/daily-retro.json"
          if [[ "${{ github.event.inputs.restore_json_from_issue }}" == "true" ]]; then
            chmod +x scripts/workflows/postmerge-retro/*.sh 2>/dev/null || true
            bash scripts/workflows/postmerge-retro/fetch-daily-retro-json-from-issue.sh "$RUN_DATE" "$DAILY_JSON"
          elif [[ -n "${{ github.event.inputs.artifact_run_id }}" ]]; then
            ATTEMPT="${{ github.event.inputs.artifact_run_attempt || '1' }}"
            ARTIFACT_NAME="postmerge-retro-daily-${RUN_DATE}-attempt-${ATTEMPT}"
            gh run download "${{ github.event.inputs.artifact_run_id }}" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D .artifacts/postmerge-retro/
            [[ -f "$DAILY_JSON" ]] || { echo "::error::Missing $DAILY_JSON after artifact download"; exit 1; }
          else
            echo "::error::fix_only requires restore_json_from_issue=true or artifact_run_id" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run daily fix pass
        id: fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_PAT: ${{ secrets.CLAUDE_PAT }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [[ -n "${CLAUDE_PAT:-}" ]]; then
            export GH_TOKEN="$CLAUDE_PAT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          chmod +x scripts/workflows/postmerge-retro/*.sh 2>/dev/null || true
          chmod +x scripts/workflows/advisory-review/*.sh 2>/dev/null || true
          RUN_DATE="${RUN_DATE:-${{ github.event.inputs.run_date || needs.daily-retro.outputs.run_date }}}"
          DAILY_JSON=".artifacts/postmerge-retro/daily-${RUN_DATE}/daily-retro.json"
          [[ -f "$DAILY_JSON" ]] || { echo "::error::Missing $DAILY_JSON"; exit 1; }
          set -o pipefail
          bash scripts/workflows/postmerge-retro/run-postmerge-retro-fix.sh "$DAILY_JSON" | tee fix.log
          fix_exit=${PIPESTATUS[0]}
          if [[ "$fix_exit" -ne 0 ]]; then
            echo "::error::run-postmerge-retro-fix.sh failed with exit ${fix_exit}" >&2
            exit "$fix_exit"
          fi
          if grep -q 'Created draft PR:' fix.log; then
            url="$(grep 'Created draft PR:' fix.log | sed 's/.*Created draft PR: //')"
            echo "fix_pr_url=${url}" >> "$GITHUB_OUTPUT"
          elif grep -q 'Open draft PR already exists:' fix.log; then
            num="$(grep 'Open draft PR already exists:' fix.log | sed 's/.*#//')"
            url="$(gh pr view "$num" --json url --jq .url)"
            echo "fix_pr_url=${url}" >> "$GITHUB_OUTPUT"
          fi
