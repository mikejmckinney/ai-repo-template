# Lint and Format Workflow
# ------------------------
# Runs on every PR and push to main/develop.
#
# Jobs
# ----
#   lint-and-format — shellcheck (warning+, blocks), shfmt (-d, blocks),
#                     actionlint (blocks), markdownlint (continue-on-error).
#
# Design notes
# ------------
# * shellcheck / shfmt / actionlint do NOT use continue-on-error.  Any
#   warning-or-above severity blocks the PR — this is intentional (issue #229
#   Phase 1).
# * Markdownlint runs with `continue-on-error: true`. Downstream projects
#   created from this template often have markdown issues during initial setup.
#   Flip to `false` once the project has reached a stable state.
# * The `[skip lint]` check below uses
#     !contains(github.event.head_commit.message, '[skip lint]')
#   which is safe on both push and pull_request triggers: on PR events
#   `github.event.head_commit` is null, and GitHub Actions' `contains(null, ...)`
#   returns false, so the overall condition evaluates to true (= run the job).
#   Do NOT wrap with `message != null && ...` — that inverts PR behavior.
# * For downstream projects needing a different tech stack, add your linter
#   steps after the "Add project-specific linters here" comment. The shell /
#   workflow linters below are universal and should remain even in derived repos.

name: Lint and Format

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Only run one instance per PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    # Skip if commit message contains [skip lint] or is from the formatter bot
    if: |
      !contains(github.event.head_commit.message, '[skip lint]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # SHELL LINTING — shellcheck (warning+, blocks)
      # =====================================================
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # Severity warning+ blocks the PR (no continue-on-error).
        # SC1091: not following sourced files — suppressed repo-wide because
        #   test scripts source sibling scripts by computed path which
        #   shellcheck cannot follow statically.
        # `-r -0` is required on GNU xargs: `-r` skips invocation when no
        # input; `-0` (null-delimited, pairs with -print0) handles filenames
        # with spaces or special characters (SC2038).
        run: |
          find . \( -name '.git' -o -name 'node_modules' \) -prune -o \
            -name '*.sh' -print0 \
            | xargs -r -0 shellcheck --severity=warning --exclude=SC1091

      # =====================================================
      # SHELL FORMATTING — shfmt (-d, blocks)
      # =====================================================
      - name: Install shfmt
        run: |
          SHFMT_VERSION="3.8.0"
          curl -sSL \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Run shfmt (diff check)
        # -d: print diff and exit non-zero if any file would change.
        # -i 2: 2-space indent (matches repo convention).
        # -bn: binary ops at start of line.
        # -ci: indent case statements.
        # `-r -0` pairs with -print0 to handle filenames with spaces or
        # special characters (SC2038).
        run: |
          find . \( -name '.git' -o -name 'node_modules' \) -prune -o \
            -name '*.sh' -print0 \
            | xargs -r -0 shfmt -d -i 2 -bn -ci

      # =====================================================
      # WORKFLOW LINTING — actionlint (blocks)
      # =====================================================
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint

      - name: Run actionlint
        # Lint all workflow YAML files. actionlint integrates with shellcheck
        # for `run:` blocks, catching expression and shell issues together.
        # Patterns suppressed here are false positives or pre-existing
        # info/style-level shellcheck findings in existing workflow files;
        # see .github/actionlint.yaml for rationale.  SC2016 = jq single-quote
        # expressions (intentional); SC2086/SC2129/SC2153/SC2018/SC2019 =
        # pre-existing info/style patterns tracked in follow-up issues.
        run: |
          find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -r -0 actionlint \
              -ignore 'SC2016' \
              -ignore 'SC2086' \
              -ignore 'SC2129' \
              -ignore 'SC2153' \
              -ignore 'SC2018' \
              -ignore 'SC2019'

      # =====================================================
      # Add project-specific linters here (Node, Python, Go…)
      # =====================================================

      # =====================================================
      # MARKDOWN LINTING (continue-on-error for template use)
      # =====================================================
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**
        continue-on-error: true
