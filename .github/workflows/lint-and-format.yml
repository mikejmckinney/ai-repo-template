# Lint and Format Workflow
# ------------------------
# Runs on every PR and push to main/develop.
#
# Jobs
# ----
#   lint-and-format — shellcheck (warning+, blocks), shfmt (-d, blocks),
#                     actionlint (blocks), changed-file markdownlint (blocks),
#                     repo-wide markdownlint debt summary (advisory).
#
# Design notes
# ------------
# * shellcheck / shfmt / actionlint do NOT use continue-on-error.  Any
#   warning-or-above severity blocks the PR — this is intentional (issue #229
#   Phase 1).
# * Markdownlint has two distinct signals (issue #309): changed Markdown files
#   are linted as a blocking gate using .markdownlint-cli2.jsonc, while
#   repo-wide Markdown debt is summarized in the job summary as advisory-only
#   output. The advisory path redirects CLI output to a log and prints only a
#   short tail, avoiding thousands of GitHub ##[error] annotations in a green
#   required workflow. On pull_request events, changed files are computed from
#   the merge-base to avoid linting unrelated files from target-branch drift.
# * The `[skip lint]` check below uses
#     !contains(github.event.head_commit.message, '[skip lint]')
#   which is safe on both push and pull_request triggers: on PR events
#   `github.event.head_commit` is null, and GitHub Actions' `contains(null, ...)`
#   returns false, so the overall condition evaluates to true (= run the job).
#   Do NOT wrap with `message != null && ...` — that inverts PR behavior.
# * For downstream projects needing a different tech stack, add your linter
#   steps after the "Add project-specific linters here" comment. The shell /
#   workflow linters below are universal and should remain even in derived repos.

name: Lint and Format

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Only run one instance per PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    # Skip if commit message contains [skip lint] or is from the formatter bot
    if: |
      !contains(github.event.head_commit.message, '[skip lint]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # SHELL LINTING — shellcheck (warning+, blocks)
      # =====================================================
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        # Severity warning+ blocks the PR (no continue-on-error).
        # SC1091: not following sourced files — suppressed repo-wide because
        #   test scripts source sibling scripts by computed path which
        #   shellcheck cannot follow statically.
        # `-r -0` is required on GNU xargs: `-r` skips invocation when no
        # input; `-0` (null-delimited, pairs with -print0) handles filenames
        # with spaces or special characters (SC2038).
        run: |
          find . \( -name '.git' -o -name 'node_modules' \) -prune -o \
            -name '*.sh' -print0 \
            | xargs -r -0 shellcheck --severity=warning --exclude=SC1091

      # =====================================================
      # SHELL FORMATTING — shfmt (-d, blocks)
      # =====================================================
      - name: Install shfmt
        run: |
          SHFMT_VERSION="3.8.0"
          curl -sSL \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: Run shfmt (diff check)
        # -d: print diff and exit non-zero if any file would change.
        # -i 2: 2-space indent (matches repo convention).
        # -bn: binary ops at start of line.
        # -ci: indent case statements.
        # `-r -0` pairs with -print0 to handle filenames with spaces or
        # special characters (SC2038).
        run: |
          find . \( -name '.git' -o -name 'node_modules' \) -prune -o \
            -name '*.sh' -print0 \
            | xargs -r -0 shfmt -d -i 2 -bn -ci

      # =====================================================
      # WORKFLOW LINTING — actionlint (blocks)
      # =====================================================
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint

      - name: Run actionlint
        # Lint all workflow YAML files. actionlint integrates with shellcheck
        # for `run:` blocks, catching expression and shell issues together.
        # Patterns suppressed here are false positives or pre-existing
        # info/style-level shellcheck findings in existing workflow files.
        # SC2016 = jq single-quote expressions (intentional);
        # SC2086/SC2129/SC2153/SC2018/SC2019 = pre-existing info/style
        # patterns tracked in follow-up issues.  Suppressions are passed
        # via CLI flags rather than a config file — actionlint config
        # auto-discovery is unreliable in CI runner environments.
        run: |
          find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -r -0 actionlint \
              -ignore 'SC2016' \
              -ignore 'SC2086' \
              -ignore 'SC2129' \
              -ignore 'SC2153' \
              -ignore 'SC2018' \
              -ignore 'SC2019'

      # =====================================================
      # Add project-specific linters here (Node, Python, Go…)
      # =====================================================

      # =====================================================
      # SHELL CONVENTION LINTING (issue #229 Phase 1.5c)
      # =====================================================
      - name: Run lint-shell-conventions
        # Encodes project-specific rules that shellcheck cannot catch:
        # RULE-01: grep -c in set -e/pipefail scripts without || true
        #          (grep -c exits 1 on 0 matches, killing set -e scripts)
        # RULE-02: grep -E literal patterns with | alternatives that do
        #          not end with $ or \ (unanchored substring matching)
        run: bash scripts/lint-shell-conventions.sh scripts/

      # =====================================================
      # MARKDOWN LINTING — changed files block, repo-wide debt summarizes
      # =====================================================
      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.17.2

      - name: Collect changed Markdown files
        id: markdown-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"

            merge_base="$(git merge-base "${base_ref}" "${head_ref}" || true)"
            if [[ -n "${merge_base}" ]]; then
              base_ref="${merge_base}"
            fi
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            base_ref="$(git rev-list --max-parents=0 "${head_ref}" | tail -n 1)"
          fi

          git -c core.quotepath=off diff --name-only -z --diff-filter=ACMRT "${base_ref}" "${head_ref}" \
            > /tmp/changed-files-z

          : > /tmp/changed-markdown-files-z
          while IFS= read -r -d '' file; do
            if [[ "${file}" == *.md ]] && [[ ! "${file}" =~ (^|/)node_modules/|(^|/)\.git/ ]]; then
              printf '%s\0' "${file}" >> /tmp/changed-markdown-files-z
            fi
          done < /tmp/changed-files-z

          if [[ -s /tmp/changed-markdown-files-z ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            {
              echo "### Changed Markdown files"
              echo
              while IFS= read -r -d '' file; do
                echo "- \`${file}\`"
              done < /tmp/changed-markdown-files-z
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changed Markdown files to lint." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Lint changed Markdown files (blocking)
        if: steps.markdown-files.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Lints whole changed files, not changed lines.
          mapfile -d '' -t changed_files < /tmp/changed-markdown-files-z
          markdownlint-cli2 --config .markdownlint-cli2.jsonc "${changed_files[@]}"

      - name: Markdownlint advisory repo-wide summary
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          markdownlint-cli2 --config .markdownlint-cli2.jsonc \
            "**/*.md" "!node_modules/**" "!.git/**" \
            > /tmp/markdownlint-advisory.log 2>&1
          status=$?
          set -e

          {
            echo "### Markdownlint advisory repo-wide report"
            echo
            if [[ "${status}" -eq 0 ]]; then
              echo "No repo-wide Markdownlint findings under the current config."
            else
              echo "Repo-wide Markdownlint debt remains advisory; changed Markdown files are checked by the blocking step above."
              echo
              echo '```text'
              tail -n 80 /tmp/markdownlint-advisory.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit 0
